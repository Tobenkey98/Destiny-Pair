name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Values passed through to the VPS as remote env vars (via the `envs`
    # input below) so the server's Backend/.env can be kept in sync with
    # live configuration on every deploy. Empty values default to live mode.
    env:
      FLUTTERWAVE_CLIENT_ID: ${{ secrets.FLUTTERWAVE_CLIENT_ID }}
      FLUTTERWAVE_CLIENT_SECRET: ${{ secrets.FLUTTERWAVE_CLIENT_SECRET }}
      FLUTTERWAVE_ENCRYPTION_KEY: ${{ secrets.FLUTTERWAVE_ENCRYPTION_KEY }}
      FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
      FLUTTERWAVE_SECRET_HASH: ${{ secrets.FLUTTERWAVE_SECRET_HASH }}
      FLUTTERWAVE_SANDBOX: ${{ secrets.FLUTTERWAVE_SANDBOX }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FLUTTERWAVE_CLIENT_ID,FLUTTERWAVE_CLIENT_SECRET,FLUTTERWAVE_ENCRYPTION_KEY,FLUTTERWAVE_PUBLIC_KEY,FLUTTERWAVE_SECRET_HASH,FLUTTERWAVE_SANDBOX,FRONTEND_URL
          script: |
            # Fail the run on the first error so a broken deploy can never
            # report success (appleboy/ssh-action does not set -e by default,
            # which previously masked failures and left old code running).
            set -euo pipefail

            # Navigate to the main project directory
            cd /var/www/destinypair

            # Fetch and hard-reset so a locally modified tree (e.g. the
            # __pycache__/*.pyc files that Python rewrites on the server) can
            # never abort the deploy again. Untracked files (Backend/.env,
            # uploads, etc.) are untouched.
            git fetch origin main
            git reset --hard origin/main
            echo "Checked out: $(git rev-parse HEAD) (expected ${{ github.sha }})"

            # Build the static frontend files
            cd Frontend
            
            # --- CREATE FRONTEND .ENV DYNAMICALLY ---
            cat > .env <<EOF
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_FACEBOOK_APP_ID=${{ secrets.VITE_FACEBOOK_APP_ID }}
            EOF
            # ----------------------------------------
            
            npm install
            npm run build

            # Apply any database changes and restart Django.
            # Daphne serves websockets (live chat/calls); restart it too once
            # the daphne systemd service exists — until then this warns only.
            cd ../Backend
            source ../venv/bin/activate

            # --- SYNC LIVE CONFIG INTO Backend/.env -------------------
            # The repo never ships .env (it is gitignored), so the server's
            # copy can silently keep stale/test values. Rewrite the runtime
            # keys from these workflow env vars on every deploy so the live
            # payment gateway is always configured correctly. Keys with no
            # value are left untouched (never clobber an existing value).
            # The stale sandbox flag is only pinned off (live API) once live
            # client credentials are actually provided via secrets, so a
            # deploy can never flip to live mode while test keys remain.
            python - <<'PYEOF'
            import os
            from pathlib import Path
            from dotenv import set_key

            env = Path('.env')

            KEYS = (
                'FLUTTERWAVE_CLIENT_ID',
                'FLUTTERWAVE_CLIENT_SECRET',
                'FLUTTERWAVE_ENCRYPTION_KEY',
                'FLUTTERWAVE_PUBLIC_KEY',
                'FLUTTERWAVE_SECRET_HASH',
                'FRONTEND_URL',
            )
            for key in KEYS:
                value = os.environ.get(key, '')
                if value:
                    set_key(str(env), key, value, quote_mode='always')
            # Only force live mode when real live credentials are configured.
            has_live_creds = bool(
                os.environ.get('FLUTTERWAVE_CLIENT_ID')
                and os.environ.get('FLUTTERWAVE_CLIENT_SECRET')
            )
            if has_live_creds:
                # Stale sandbox flag: reset (empty -> live API).
                set_key(str(env), 'FLUTTERWAVE_SANDBOX', '', quote_mode='always')
                print('Backend/.env pushed to live Flutterwave (sandbox off)')
            else:
                print('Backend/.env: live Flutterwave secrets not set - leaving config untouched')
            PYEOF

            # Mirror the .env values into the DB integration overrides so a
            # stale IntegrationSetting row can never shadow the live config.
            python manage.py sync_integrations_from_env

            python manage.py migrate
            python manage.py seed_plans
            sudo systemctl restart gunicorn
            sudo systemctl restart daphne || echo "WARNING: daphne service not installed yet (live chat needs it)"
            echo "Deploy OK: $(git rev-parse HEAD)"