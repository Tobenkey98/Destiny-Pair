name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Fail the run on the first error so a broken deploy can never
            # report success (appleboy/ssh-action does not set -e by default,
            # which previously masked failures and left old code running).
            set -euo pipefail

            # Navigate to the main project directory
            cd /var/www/destinypair

            # Pull the newest code from GitHub
            git pull origin main
            echo "Checked out: $(git rev-parse HEAD) (expected ${{ github.sha }})"

            # Build the static frontend files
            cd Frontend
            npm install
            npm run build

            # Apply any database changes and restart Django
            cd ../Backend
            source ../venv/bin/activate
            python manage.py migrate
            sudo systemctl restart gunicorn
            echo "Deploy OK: $(git rev-parse HEAD)"