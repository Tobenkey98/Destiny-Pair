<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DestinyPair{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background-color: #f7f3ea; margin: 0; padding: 0; }
    .wrapper { padding: 40px 16px; }
    .container { max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px -15px rgba(97, 28, 43, 0.25); }
    .header { background: linear-gradient(135deg, #611C2B, #7A2E3B); padding: 40px 32px 32px; text-align: center; }
    .header .brand { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 700; color: #ffffff; margin: 0; }
    .header .brand span { color: #C8A96E; }
    .header .tagline { color: #C8A96E; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin: 10px 0 0; }
    .body { padding: 34px 36px 12px; text-align: center; }
    .body h2 { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; color: #611C2B; margin: 0 0 14px; }
    .body p { font-size: 15px; line-height: 1.7; color: #4a3f3a; margin: 0 0 14px; }
    .heart { font-size: 44px; margin: 4px 0 8px; }
    .btn { display: inline-block; margin: 14px 0 6px; padding: 14px 36px; background: #611C2B; color: #ffffff !important; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 14px; }
    .btn-gold { background: #C8A96E; color: #611C2B !important; }
    .panel { text-align: left; background: #f7f3ea; border-radius: 16px; padding: 18px 22px; margin: 20px 0; }
    .panel p { font-size: 14px; margin: 0 0 8px; }
    .code-box { background: #f7f3ea; border: 2px dashed #C8A96E; border-radius: 18px; padding: 22px 20px; margin: 26px 0; }
    .code-box span { font-family: 'Courier New', monospace; font-size: 44px; font-weight: 700; letter-spacing: 14px; color: #611C2B; padding-left: 14px; }
    .note { display: inline-block; background: rgba(200, 169, 110, 0.15); border-radius: 999px; padding: 8px 18px; font-size: 13px; color: #7A2E3B; margin-bottom: 8px; }
    .fine { font-size: 13px; color: #8a7f78; }
    .divider { border: none; border-top: 1px solid #eee5d3; margin: 24px 0; }
    .footer { padding: 26px 32px 32px; background: #611C2B; text-align: center; }
    .footer p { font-size: 12px; line-height: 1.7; color: rgba(255, 255, 255, 0.75); margin: 0 0 6px; }
    .footer a { color: #C8A96E; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <p class="brand">Destiny<span>Pair</span></p>
        <p class="tagline">Purposeful Introductions &bull; Healthy Marriages</p>
      </div>
      <div class="body">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p>&copy; 2026 <a href="https://destinypair.net">DestinyPair.net</a> &mdash; Connecting purposeful singles across Nigeria and beyond.</p>
        <p>Alakuko, Lagos &bull; support@destinypair.net</p>
      </div>
    </div>
  </div>
</body>
</html>
