<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: system-ui, sans-serif; background: #f9f5f0; padding: 32px;">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.08);">
    <div style="padding: 32px 24px 24px; text-align: center;">
      <h1 style="font-size: 22px; color: #1a3520; margin: 0 0 8px;">Password Reset</h1>
      <p style="color: #6b7280; font-size: 14px;">Hi {{ user.first_name|default:"there" }}, use the code below to reset your password.</p>
      <div style="margin: 24px 0; padding: 16px; background: #f3f9f4; border-radius: 16px;">
        <span style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #1a3520;">{{ code }}</span>
      </div>
      <p style="color: #9ca3af; font-size: 12px;">This code expires in 10 minutes. If you didn't request this, ignore this email.</p>
    </div>
    <div style="padding: 16px 24px; background: #f3f9f4; text-align: center; font-size: 11px; color: #9ca3af;">
      DestinyPair &copy; Pure Intentions Global Tech Services
    </div>
  </div>
</body>
</html>
